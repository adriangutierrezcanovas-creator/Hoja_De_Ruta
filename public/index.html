<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja de Ruta</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#0a0a0a; --surf:#141414; --card:#1a1918; --brd:#242220;
  --text:#ddd9d0; --t2:#8a8480; --t3:#504a46;
  --red:#c41a1a; --rBg:#1a0404; --rBrd:#5a1010;
  --blue:#3a7ec4; --blueBg:#0a1a2e; --blueBrd:#1a3a60;
}
:root[data-theme="light"] {
  --bg:#f4f2ed; --surf:#ffffff; --card:#ffffff; --brd:#e0dcd5;
  --text:#1a1814; --t2:#6a6460; --t3:#a09890;
  --red:#c41a1a; --rBg:#fdf0f0; --rBrd:#edb8b8;
  --blue:#2070b8; --blueBg:#e8f0fb; --blueBrd:#b0c8f0;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.bebas { font-family:"Bebas Neue",sans-serif; letter-spacing:.5px; }
.mono { font-family:"JetBrains Mono",monospace; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select { font-family:inherit; }

#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; background:var(--surf); border-bottom:1px solid var(--brd);
  position:sticky; top:0; z-index:10;
}
#topbar .left { display:flex; align-items:center; gap:10px; }
#topbar .titles { display:flex; flex-direction:column; }
#topbar h1 { font-size:22px; }
#topbar h1 .hl { color:var(--red); }
#topbar .subtitle { font-size:11px; color:var(--t2); letter-spacing:1px; text-transform:uppercase; margin-top:1px; display:none; }
#topbar .subtitle.visible { display:block; }
.icon-btn {
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; border:1px solid var(--brd); color:var(--text);
}
.icon-btn:active { background:var(--card); }
.icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
.theme-toggle {
  display:flex; align-items:center; gap:6px; height:36px; padding:0 14px;
  border-radius:20px; border:1px solid var(--brd); color:var(--text); font-size:13px;
}
.theme-toggle:active { background:var(--card); }
.theme-toggle svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }

#app { flex:1; overflow-y:auto; padding-bottom:12px; }

#bottomnav {
  display:none; border-top:1px solid var(--brd); background:var(--surf);
}
#bottomnav.visible { display:flex; }
#bottomnav button {
  flex:1; padding:12px 0; text-align:center; font-size:12px; color:var(--t2);
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
#bottomnav button.active { color:var(--red); }
#bottomnav button svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; }

/* ---------- HOME ---------- */
.home-half {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:24px; transition:background .15s;
}
.home-half:active { background:var(--card); }
#homeView { display:flex; flex-direction:column; height:100%; min-height:calc(100vh - 65px); }
.home-split { border-bottom:2px solid var(--red); }
.home-title-bolos { font-size:58px; color:var(--red); line-height:1; }
.home-title-lomo { font-size:46px; color:var(--red); line-height:1; }
.home-sub { font-size:12px; color:var(--t2); }

/* ---------- BOLO LIST ---------- */
.bolo-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:1px solid var(--brd);
}
.bolo-row .venue { font-size:18px; }
.bolo-row .right { text-align:right; }
.bolo-row .citydate { font-size:12px; color:var(--t2); }
.bolo-row .duration { font-size:22px; color:var(--red); }
.empty-state { padding:40px 20px; text-align:center; color:var(--t2); font-size:14px; }

/* ---------- IMPORT ---------- */
.import-wrap { padding:20px; display:flex; flex-direction:column; gap:16px; }
.input-row { position:relative; }
.input-row input {
  width:100%; padding:12px 40px 12px 12px; background:var(--surf); border:1px solid var(--brd);
  border-radius:8px; color:var(--text); font-size:14px;
}
.input-row .tick { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#2a9d4a; display:none; }
.input-row.valid .tick { display:block; }
.btn-red {
  background:var(--red); color:#fff; padding:14px; border-radius:8px; text-align:center;
  font-size:14px; font-weight:600;
}
.btn-red:disabled { opacity:.4; }
.btn-neutral {
  background:var(--surf); border:1px solid var(--brd); color:var(--text); padding:12px; border-radius:8px; text-align:center; font-size:13px;
}
.btn-blue { background:var(--blueBg); border:1px solid var(--blueBrd); color:var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; text-align:center; }
.note { font-size:12px; color:var(--t2); line-height:1.5; }
.import-error { font-size:13px; color:var(--red); }

/* ---------- BOLO DETAIL ---------- */
.hero { padding:26px 24px; border-bottom:1px solid var(--brd); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.hero-venue { font-size:38px; line-height:1.05; color:var(--red); text-transform:uppercase; }
.hero-right { text-align:right; flex-shrink:0; }
.hero-duration { font-size:34px; }
.hero-date, .hero-weather { font-size:14px; color:var(--t2); margin-top:4px; }
.hero-btns { display:flex; gap:12px; margin-top:20px; }
.hero-btns a, .hero-btns button { flex:1; padding:14px; border-radius:10px; text-align:center; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; }
.hero-btns svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
.hero-btn-venue { background:var(--rBg); border:1px solid var(--rBrd); color:var(--red); }
.hero-acceso {
  margin-top:20px; padding:14px 16px; background:var(--card); border:1px solid var(--brd); border-radius:10px;
  font-size:14px; color:var(--t2); display:flex; gap:10px; line-height:1.5;
}
.hero-acceso b { color:var(--text); }

.section { padding:22px 24px; border-bottom:1px solid var(--brd); }
.section-head { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.section-head svg { width:20px; height:20px; stroke:var(--red); fill:none; stroke-width:2; }
.section-head span { font-family:"Bebas Neue",sans-serif; font-size:19px; letter-spacing:2px; color:var(--red); }
.section-head .line { flex:1; height:1px; background:var(--brd); }

/* agenda timeline */
.timeline { position:relative; padding-left:26px; }
.timeline::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--brd); }
.tl-item { position:relative; padding-bottom:24px; display:flex; gap:14px; align-items:baseline; }
.tl-item:last-child { padding-bottom:0; }
.tl-dot { position:absolute; left:-26px; top:5px; border-radius:50%; background:var(--t2); width:10px; height:10px; }
.tl-item.type-load .tl-dot, .tl-item.type-work .tl-dot { background:var(--red); width:13px; height:13px; left:-27px; }
.tl-item.type-show .tl-dot { background:var(--red); width:17px; height:17px; left:-29px; box-shadow:0 0 8px 2px rgba(196,26,26,.6); }
.tl-hora { font-family:"JetBrains Mono",monospace; font-size:15px; color:var(--t2); min-width:56px; }
.tl-item.type-load .tl-hora, .tl-item.type-work .tl-hora { color:var(--red); font-weight:600; }
.tl-item.type-show .tl-hora { font-family:"Bebas Neue",sans-serif; font-size:22px; color:var(--red); }
.tl-label { font-size:16px; color:var(--t2); }
.tl-item.type-load .tl-label, .tl-item.type-work .tl-label { color:var(--text); font-weight:500; }
.tl-item.type-show .tl-label { font-family:"Bebas Neue",sans-serif; font-size:22px; color:var(--red); letter-spacing:1px; text-transform:uppercase; }
.tl-dur { font-size:13px; color:var(--t3); margin-left:8px; }

/* hotel card */
.hotel-card { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:20px; margin-bottom:16px; }
.hotel-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.hotel-name { font-family:"Bebas Neue",sans-serif; font-size:22px; text-transform:uppercase; }
.venue-card { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:18px 20px; }
.venue-card .lugar { font-family:"Bebas Neue",sans-serif; font-size:19px; text-transform:uppercase; }
.venue-card .addr { font-size:14px; color:var(--t2); margin-top:6px; line-height:1.4; }
.hotel-addr { font-size:14px; color:var(--t2); margin:6px 0 14px; line-height:1.4; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:14px 0; }
.grid2 .kv-label { font-size:11px; color:var(--t3); text-transform:uppercase; letter-spacing:1px; }
.grid2 .kv-value { font-size:15px; margin-top:3px; }
.phone-btns { display:flex; gap:10px; margin-top:14px; }
.phone-btns a {
  flex:1; padding:12px; border-radius:8px; text-align:center; font-size:14px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.phone-btns a.tel-btn { background:var(--blueBg); border:1px solid var(--blueBrd); color:var(--blue); }
.phone-btns a.wa-btn { background:#0d3b28; border:1px solid #1f6b47; color:#3ddc84; }
:root[data-theme="light"] .phone-btns a.wa-btn { background:#e6f7ee; border-color:#a8e0c2; color:#1c9152; }
.phone-btns svg { width:18px; height:18px; flex-shrink:0; }

/* contactos */
.contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.contact-item .role { font-size:11px; color:var(--t3); text-transform:uppercase; letter-spacing:1px; }
.contact-item .nombre { font-size:17px; margin:3px 0 10px; }

/* tour party */
.kv-list .kv-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--brd); font-size:16px; }
.kv-list .kv-row:last-child { border-bottom:none; }
.kv-list .kv-row .k { color:var(--t2); }

/* ---------- COMER ---------- */
.comer-form { padding:20px; display:flex; flex-direction:column; gap:18px; max-width:720px; margin:0 auto; }
.field label { font-size:13px; color:var(--t2); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
.field-row { display:flex; gap:12px; }
.field { flex:1; }
.field input, .field select {
  width:100%; padding:14px 16px; background:var(--surf); border:1px solid var(--brd);
  border-radius:10px; color:var(--text); font-size:17px;
}
.geoloc-row { display:flex; gap:10px; }
.geoloc-row input { flex:1; }
.geoloc-row .icon-btn, .restaurant-actions .icon-btn { width:48px; height:48px; flex-shrink:0; }
.geoloc-row .icon-btn svg, .restaurant-actions .icon-btn svg { width:22px; height:22px; }
.budget-row { display:flex; gap:10px; }
.budget-btn { flex:1; padding:14px; border-radius:10px; border:1px solid var(--brd); background:var(--surf); font-size:17px; text-align:center; }
.budget-btn.active { background:var(--rBg); border-color:var(--rBrd); color:var(--red); }
.comer-form .btn-red { font-size:16px; padding:16px; }

#comerResults { max-width:900px; margin:0 auto; }
.restaurant-card {
  display:flex; justify-content:space-between; align-items:center;
  padding:22px 24px; border-bottom:1px solid var(--brd); gap:16px;
}
.restaurant-info .name { font-size:20px; }
.restaurant-info .meta { font-size:15px; color:var(--t2); margin-top:6px; line-height:1.5; }
.restaurant-actions { display:flex; align-items:center; gap:10px; }
.fav-btn svg { width:26px; height:26px; stroke:var(--t2); fill:none; stroke-width:2; }
.fav-btn.active svg { stroke:var(--red); fill:var(--red); }
#map { height:440px; margin:16px auto 0; max-width:900px; border-radius:10px; overflow:hidden; border:1px solid var(--brd); }

.loading { padding:40px; text-align:center; color:var(--t2); font-size:15px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="left">
    <button class="icon-btn" id="backBtn" style="display:none" data-action="back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="titles">
      <h1 class="bebas">HOJA DE <span class="hl">RUTA</span></h1>
      <div class="subtitle" id="topbarSubtitle"></div>
    </div>
  </div>
  <div class="right" style="display:flex; gap:8px;">
    <button class="icon-btn" id="importBtn" style="display:none" data-action="go" data-target="#/bolos/import">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    </button>
    <button class="theme-toggle" id="themeBtn" data-action="toggle-theme">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
      <span id="themeLabel"></span>
    </button>
  </div>
</div>

<div id="app"></div>

<div id="bottomnav">
  <button data-action="go" data-target="#/comer">
    <svg viewBox="0 0 24 24"><path d="M3 3v18M3 3h4v8H3M14 3v18M18 3a3 3 0 013 3v4a3 3 0 01-3 3M18 3v18"/></svg>
    Comer
  </button>
  <button data-action="go" data-target="#/favoritos">
    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    Favoritos
  </button>
</div>

<script>
// =========================================================================
// STORAGE
// =========================================================================
const store = {
  theme: {
    get: () => localStorage.getItem('hdr-theme') || 'dark',
    set: (v) => localStorage.setItem('hdr-theme', v),
  },
  bolos: {
    get: () => JSON.parse(localStorage.getItem('hdr-bolos') || '[]'),
    set: (v) => localStorage.setItem('hdr-bolos', JSON.stringify(v)),
  },
  favoritos: {
    get: () => JSON.parse(localStorage.getItem('hdr-favoritos') || '{}'),
    set: (v) => localStorage.setItem('hdr-favoritos', JSON.stringify(v)),
  },
};

// =========================================================================
// HELPERS
// =========================================================================
function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function mapsUrl(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
const PHONE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>';
const WHATSAPP_ICON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.43 12.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51-.17-.01-.37-.01-.57-.01-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/></svg>';
function phoneBtns(raw) {
  if (!raw) return '';
  const digits = raw.replace(/[^\d+]/g, '');
  const wa = digits.replace(/[^\d]/g, '');
  return `<div class="phone-btns">
    <a class="tel-btn" href="tel:${esc(digits)}">${PHONE_ICON_SVG}${esc(raw)}</a>
    <a class="wa-btn" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${WHATSAPP_ICON_SVG}WhatsApp</a>
  </div>`;
}
function icon(path) { return `<svg viewBox="0 0 24 24">${path}</svg>`; }
const ICONS = {
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  hotel: '<path d="M3 21V8a1 1 0 011-1h4v14M3 21h18M9 21V11h6v10M15 7V4a1 1 0 011-1h4a1 1 0 011 1v17"/>',
  contacts: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2M17 3.5a4 4 0 010 7"/>',
  vehicle: '<path d="M3 13l2-6h14l2 6M5 13h14v5H5zM7 18v2M17 18v2"/>',
  party: '<path d="M12 2l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"/>',
  cloud: '<path d="M17.5 19a4.5 4.5 0 000-9 6 6 0 00-11.4-1.5A4 4 0 006 17h11.5z"/>',
  pin: '<path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
};
function sectionHead(iconKey, title) {
  return `<div class="section-head">${icon(ICONS[iconKey])}<span>${esc(title)}</span><div class="line"></div></div>`;
}
function fmtTime(totalMinutes) {
  totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
  const h = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
  const m = Math.floor(totalMinutes % 60).toString().padStart(2, '0');
  return `${h}:${m}`;
}
function timeToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
const WEEKDAYS_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function parseBoloDate(str) {
  if (!str) return null;
  const iso = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const dmy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  let d;
  if (iso) {
    d = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
  } else if (dmy) {
    let year = Number(dmy[3]);
    if (year < 100) year += 2000;
    d = new Date(year, Number(dmy[2]) - 1, Number(dmy[1]));
  }
  return d && !isNaN(d) ? d : null;
}
function formatBoloDate(str) {
  const d = parseBoloDate(str);
  if (!d) return str || '';
  return `${WEEKDAYS_ES[d.getDay()]} ${d.getDate()} ${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}`;
}
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// =========================================================================
// ROUTER
// =========================================================================
const routes = [];
function route(pattern, handler) { routes.push({ pattern, handler }); }
function matchRoute(hash) {
  for (const r of routes) {
    const paramNames = [];
    const regexStr = r.pattern.replace(/:[^/]+/g, (m) => { paramNames.push(m.slice(1)); return '([^/]+)'; });
    const match = hash.match(new RegExp(`^${regexStr}$`));
    if (match) {
      const params = {};
      paramNames.forEach((name, i) => params[name] = decodeURIComponent(match[i + 1]));
      return { handler: r.handler, params };
    }
  }
  return null;
}

const backStack = [];
function go(hash, { replace = false } = {}) {
  if (!replace && location.hash && location.hash !== hash) backStack.push(location.hash);
  location.hash = hash;
}
function goBack() {
  const prev = backStack.pop();
  location.hash = prev || '#/home';
}

function render() {
  const hash = location.hash || '#/home';
  const app = document.getElementById('app');
  const found = matchRoute(hash.replace(/^#/, '#'));
  const inBolos = hash.startsWith('#/bolos');
  const inComer = hash.startsWith('#/comer') || hash.startsWith('#/favoritos');

  document.getElementById('backBtn').style.display = inBolos ? 'flex' : 'none';
  document.getElementById('importBtn').style.display = (hash === '#/bolos') ? 'flex' : 'none';
  document.getElementById('bottomnav').classList.toggle('visible', inComer);
  document.querySelectorAll('#bottomnav button').forEach((b) => {
    b.classList.toggle('active', b.dataset.target === hash);
  });

  const subtitleEl = document.getElementById('topbarSubtitle');
  const detailMatch = hash.match(/^#\/bolos\/([^/]+)$/);
  const bolo = detailMatch && detailMatch[1] !== 'import' ? store.bolos.get().find((b) => b.id === detailMatch[1]) : null;
  if (bolo) {
    subtitleEl.textContent = [bolo.band, formatBoloDate(bolo.date)].filter(Boolean).join(' · ');
    subtitleEl.classList.add('visible');
  } else {
    subtitleEl.classList.remove('visible');
  }

  if (!found) { app.innerHTML = viewHome(); bindHome(); return; }
  app.innerHTML = found.handler.render(found.params);
  if (found.handler.bind) found.handler.bind(found.params);
  window.scrollTo(0, 0);
}

async function geocodeOne(q) {
  const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&limit=1`);
  const data = await r.json();
  if (!data || !data.length) throw new Error(`No se encontró: ${q}`);
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), label: data[0].display_name };
}

function interpolateAlongRoute(coords, fraction) {
  // coords: array of [lng, lat]. Returns {lat,lng} at given fraction of total length.
  if (!coords || coords.length < 2) return null;
  const segs = [];
  let total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const a = { lat: coords[i][1], lng: coords[i][0] };
    const b = { lat: coords[i+1][1], lng: coords[i+1][0] };
    const d = haversine(a, b);
    segs.push({ a, b, d });
    total += d;
  }
  const target = total * Math.min(Math.max(fraction, 0), 1);
  let acc = 0;
  for (const s of segs) {
    if (acc + s.d >= target || s === segs[segs.length - 1]) {
      const segFrac = s.d ? (target - acc) / s.d : 0;
      return {
        lat: s.a.lat + (s.b.lat - s.a.lat) * segFrac,
        lng: s.a.lng + (s.b.lng - s.a.lng) * segFrac,
      };
    }
    acc += s.d;
  }
  return { lat: coords[coords.length-1][1], lng: coords[coords.length-1][0] };
}

const DETOUR_ROAD_FACTOR = 1.3; // las carreteras no son línea recta
const DETOUR_AVG_SPEED_KMH = 40; // aproximación para vías secundarias/urbanas cerca de la ruta

function estimateDetourMinutes(distanceKm) {
  const roundTripKm = distanceKm * DETOUR_ROAD_FACTOR * 2; // ida y vuelta a la ruta
  return Math.round((roundTripKm / DETOUR_AVG_SPEED_KMH) * 60);
}

function bindComer() {
  const form = document.getElementById('comerForm');
  const resultsBox = document.getElementById('comerResults');
  const mapDiv = document.getElementById('map');

  document.querySelectorAll('.budget-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.budget === comerState.budget);
    btn.addEventListener('click', () => {
      comerState.budget = btn.dataset.budget;
      document.querySelectorAll('.budget-btn').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  document.getElementById('geolocateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      comerState.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Mi ubicación' };
      document.getElementById('origenInput').value = 'Mi ubicación actual';
    }, () => alert('No se pudo obtener la ubicación'));
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultsBox.innerHTML = `<div class="loading">Buscando restaurantes en ruta...</div>`;
    mapDiv.style.display = 'none';
    try {
      const origenText = document.getElementById('origenInput').value;
      const destinoText = document.getElementById('destinoInput').value;
      const horaSalida = document.getElementById('horaSalidaInput').value;
      const horaComida = document.getElementById('horaComidaInput').value;
      const cocina = document.getElementById('cocinaInput').value;

      const origin = comerState.origin && origenText === 'Mi ubicación actual' ? comerState.origin : await geocodeOne(origenText);
      const dest = await geocodeOne(destinoText);
      comerState.origin = origin;
      comerState.dest = dest;

      const routeRes = await fetch(`/api/route?start=${origin.lng},${origin.lat}&end=${dest.lng},${dest.lat}`);
      const routeData = await routeRes.json();
      if (!routeRes.ok) throw new Error(routeData.error || 'Error calculando ruta');

      const feature = routeData.features && routeData.features[0];
      const coords = feature ? feature.geometry.coordinates : [[origin.lng, origin.lat], [dest.lng, dest.lat]];
      const totalDurationMin = feature ? feature.properties.summary.duration / 60 : haversine(origin, dest) / 80 * 60;

      const salidaMin = timeToMinutes(horaSalida);
      const comidaMin = timeToMinutes(horaComida);
      const elapsedAtMeal = comidaMin - salidaMin;

      if (elapsedAtMeal <= 0) {
        throw new Error('La hora de comida debe ser posterior a la hora de salida.');
      }
      if (elapsedAtMeal >= totalDurationMin) {
        const arrivalStr = fmtTime(salidaMin + totalDurationMin);
        throw new Error(`A esa hora ya habrías llegado a destino (llegada estimada ${arrivalStr}). Prueba con una hora de comida anterior.`);
      }

      const fraction = elapsedAtMeal / totalDurationMin;
      const mealPoint = interpolateAlongRoute(coords, fraction) || dest;

      const restRes = await fetch('/api/restaurants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: mealPoint.lat, lng: mealPoint.lng, radius: 20000, cuisine: cocina || undefined }),
      });
      const restData = await restRes.json();
      if (!restRes.ok) throw new Error(restData.error || 'Error buscando restaurantes');

      const results = (restData.elements || []).map((el, i) => {
        const lat = el.lat ?? el.center?.lat;
        const lng = el.lon ?? el.center?.lon;
        const tags = el.tags || {};
        const distanceKm = haversine(mealPoint, { lat, lng });
        return {
          id: `${el.type}${el.id}`,
          name: tags.name || 'Restaurante sin nombre',
          addr: [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' '),
          lat, lng,
          eta: fmtTime(comidaMin),
          detourMin: estimateDetourMinutes(distanceKm),
          price: tags.price_range || '—',
          rating: tags.rating || '—',
        };
      }).sort((a, b) => a.detourMin - b.detourMin);

      comerState.results = results;

      if (!results.length) {
        resultsBox.innerHTML = `<div class="empty-state">No se encontraron restaurantes cerca del punto de comida.</div>`;
        return;
      }
      resultsBox.innerHTML = results.map(renderRestaurantCard).join('');
      renderMap(coords, mealPoint, results);
    } catch (err) {
      resultsBox.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
    }
  });
}

function renderMap(coords, mealPoint, results) {
  const mapDiv = document.getElementById('map');
  mapDiv.style.display = 'block';
  if (comerState.map) { comerState.map.remove(); comerState.map = null; }
  const map = L.map(mapDiv).setView([mealPoint.lat, mealPoint.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  const latlngs = coords.map(([lng, lat]) => [lat, lng]);
  L.polyline(latlngs, { color: '#c41a1a', weight: 3 }).addTo(map);
  results.forEach((r) => {
    if (r.lat && r.lng) L.marker([r.lat, r.lng]).addTo(map).bindPopup(esc(r.name));
  });
  comerState.map = map;
}

  if (!el) return;
  const action = el.dataset.action;
  if (action === 'go') { go(el.dataset.target); }

function toggleFavorite(id) {
  const favs = store.favoritos.get();
  if (favs[id]) {
    delete favs[id];
  } else {
    const r = comerState.results.find((x) => x.id === id);
    if (r) favs[id] = r;
  }
  store.favoritos.set(favs);

const THEME_ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/>',
};
function updateThemeToggle() {
  const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  // el botón muestra el modo AL QUE CAMBIARÁS al pulsarlo, no el actual
  const showsLight = current === 'dark';
  document.getElementById('themeIcon').innerHTML = showsLight ? THEME_ICONS.sun : THEME_ICONS.moon;
  document.getElementById('themeLabel').textContent = showsLight ? 'Claro' : 'Oscuro';
}
function toggleTheme() {
  const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.theme.set(next);
  updateThemeToggle();
}
