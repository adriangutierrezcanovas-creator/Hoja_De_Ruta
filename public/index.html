<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja de Ruta</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#0a0a0a; --surf:#141414; --card:#1a1918; --brd:#242220;
  --text:#ddd9d0; --t2:#8a8480; --t3:#504a46;
  --red:#c41a1a; --rBg:#1a0404; --rBrd:#5a1010;
  --blue:#3a7ec4; --blueBg:#0a1a2e; --blueBrd:#1a3a60;
}
:root[data-theme="light"] {
  --bg:#f4f2ed; --surf:#ffffff; --card:#ffffff; --brd:#e0dcd5;
  --text:#1a1814; --t2:#6a6460; --t3:#a09890;
  --red:#c41a1a; --rBg:#fdf0f0; --rBrd:#edb8b8;
  --blue:#2070b8; --blueBg:#e8f0fb; --blueBrd:#b0c8f0;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.bebas { font-family:"Bebas Neue",sans-serif; letter-spacing:.5px; }
.mono { font-family:"JetBrains Mono",monospace; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select { font-family:inherit; }

#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; background:var(--surf); border-bottom:1px solid var(--brd);
  position:sticky; top:0; z-index:10;
}
#topbar .left { display:flex; align-items:center; gap:10px; }
#topbar h1 { font-size:22px; }
.icon-btn {
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; border:1px solid var(--brd); color:var(--text);
}
.icon-btn:active { background:var(--card); }
.icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }

#app { flex:1; overflow-y:auto; padding-bottom:12px; }

#bottomnav {
  display:none; border-top:1px solid var(--brd); background:var(--surf);
}
#bottomnav.visible { display:flex; }
#bottomnav button {
  flex:1; padding:12px 0; text-align:center; font-size:12px; color:var(--t2);
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
#bottomnav button.active { color:var(--red); }
#bottomnav button svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; }

/* ---------- HOME ---------- */
.home-half {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:24px; transition:background .15s;
}
.home-half:active { background:var(--card); }
#homeView { display:flex; flex-direction:column; height:100%; min-height:calc(100vh - 65px); }
.home-split { border-bottom:2px solid var(--red); }
.home-title-bolos { font-size:58px; color:var(--red); line-height:1; }
.home-title-lomo { font-size:46px; color:var(--red); line-height:1; }
.home-sub { font-size:12px; color:var(--t2); }

/* ---------- BOLO LIST ---------- */
.bolo-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:1px solid var(--brd);
}
.bolo-row .venue { font-size:18px; }
.bolo-row .right { text-align:right; }
.bolo-row .citydate { font-size:12px; color:var(--t2); }
.bolo-row .duration { font-size:22px; color:var(--red); }
.empty-state { padding:40px 20px; text-align:center; color:var(--t2); font-size:14px; }

/* ---------- IMPORT ---------- */
.import-wrap { padding:20px; display:flex; flex-direction:column; gap:16px; }
.input-row { position:relative; }
.input-row input {
  width:100%; padding:12px 40px 12px 12px; background:var(--surf); border:1px solid var(--brd);
  border-radius:8px; color:var(--text); font-size:14px;
}
.input-row .tick { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#2a9d4a; display:none; }
.input-row.valid .tick { display:block; }
.btn-red {
  background:var(--red); color:#fff; padding:14px; border-radius:8px; text-align:center;
  font-size:14px; font-weight:600;
}
.btn-red:disabled { opacity:.4; }
.btn-neutral {
  background:var(--surf); border:1px solid var(--brd); color:var(--text); padding:12px; border-radius:8px; text-align:center; font-size:13px;
}
.btn-blue { background:var(--blueBg); border:1px solid var(--blueBrd); color:var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; text-align:center; }
.note { font-size:12px; color:var(--t2); line-height:1.5; }
.import-error { font-size:13px; color:var(--red); }

/* ---------- BOLO DETAIL ---------- */
.hero { padding:20px; border-bottom:1px solid var(--brd); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; }
.hero-venue { font-size:26px; color:var(--red); }
.hero-right { text-align:right; }
.hero-duration { font-size:26px; }
.hero-date, .hero-weather { font-size:11px; color:var(--t2); margin-top:2px; }
.hero-btns { display:flex; gap:10px; margin-top:14px; }
.hero-btns a, .hero-btns button { flex:1; padding:10px; border-radius:8px; text-align:center; font-size:13px; }
.hero-btn-venue { background:var(--rBg); border:1px solid var(--rBrd); color:var(--red); }
.hero-acceso { margin-top:14px; font-size:12px; color:var(--t2); display:flex; gap:6px; }

.section { padding:16px 20px; border-bottom:1px solid var(--brd); }
.section-head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.section-head svg { width:14px; height:14px; stroke:var(--red); fill:none; stroke-width:2; }
.section-head span { font-family:"Bebas Neue",sans-serif; font-size:14px; letter-spacing:2px; color:var(--red); }
.section-head .line { flex:1; height:1px; background:var(--brd); }

/* agenda timeline */
.timeline { position:relative; padding-left:20px; }
.timeline::before { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:1px; background:var(--brd); }
.tl-item { position:relative; padding-bottom:18px; display:flex; gap:12px; }
.tl-item:last-child { padding-bottom:0; }
.tl-dot { position:absolute; left:-20px; top:4px; border-radius:50%; background:var(--t2); width:8px; height:8px; }
.tl-item.type-load .tl-dot, .tl-item.type-work .tl-dot { background:var(--red); width:10px; height:10px; left:-21px; }
.tl-item.type-show .tl-dot { background:var(--red); width:14px; height:14px; left:-23px; box-shadow:0 0 8px 2px rgba(196,26,26,.6); }
.tl-hora { font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--t2); min-width:44px; }
.tl-item.type-load .tl-hora, .tl-item.type-work .tl-hora { color:var(--red); }
.tl-item.type-show .tl-hora { font-family:"Bebas Neue",sans-serif; font-size:16px; color:var(--red); }
.tl-label { font-size:13px; color:var(--t2); }
.tl-item.type-load .tl-label, .tl-item.type-work .tl-label { color:var(--text); font-weight:500; }
.tl-item.type-show .tl-label { font-family:"Bebas Neue",sans-serif; font-size:16px; color:var(--red); letter-spacing:1px; }
.tl-dur { font-size:11px; color:var(--t3); margin-left:6px; }

/* hotel card */
.hotel-card { background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:14px; margin-bottom:12px; }
.hotel-name { font-family:"Bebas Neue",sans-serif; font-size:17px; }
.hotel-addr { font-size:12px; color:var(--t2); margin:4px 0 10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.grid2 .kv-label { font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:1px; }
.grid2 .kv-value { font-size:13px; margin-top:2px; }
.phone-btns { display:flex; gap:8px; margin-top:10px; }
.phone-btns a { flex:1; padding:8px; border-radius:6px; background:var(--surf); border:1px solid var(--brd); text-align:center; font-size:12px; }

/* contactos */
.contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.contact-item .role { font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:1px; }
.contact-item .nombre { font-size:14px; margin:2px 0 8px; }

/* tour party */
.kv-list .kv-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--brd); font-size:13px; }
.kv-list .kv-row:last-child { border-bottom:none; }
.kv-list .kv-row .k { color:var(--t2); }

/* ---------- COMER ---------- */
.comer-form { padding:16px; display:flex; flex-direction:column; gap:12px; }
.field label { font-size:11px; color:var(--t2); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
.field-row { display:flex; gap:8px; }
.field { flex:1; }
.field input, .field select {
  width:100%; padding:10px 12px; background:var(--surf); border:1px solid var(--brd);
  border-radius:8px; color:var(--text); font-size:14px;
}
.geoloc-row { display:flex; gap:8px; }
.geoloc-row input { flex:1; }
.budget-row { display:flex; gap:8px; }
.budget-btn { flex:1; padding:10px; border-radius:8px; border:1px solid var(--brd); background:var(--surf); font-size:14px; text-align:center; }
.budget-btn.active { background:var(--rBg); border-color:var(--rBrd); color:var(--red); }

.restaurant-card {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px; border-bottom:1px solid var(--brd); gap:10px;
}
.restaurant-info .name { font-size:15px; }
.restaurant-info .meta { font-size:12px; color:var(--t2); margin-top:2px; }
.restaurant-actions { display:flex; align-items:center; gap:8px; }
.fav-btn svg { width:20px; height:20px; stroke:var(--t2); fill:none; stroke-width:2; }
.fav-btn.active svg { stroke:var(--red); fill:var(--red); }
#map { height:280px; margin:12px 16px 0; border-radius:10px; overflow:hidden; border:1px solid var(--brd); }

.loading { padding:30px; text-align:center; color:var(--t2); font-size:13px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="left">
    <button class="icon-btn" id="backBtn" style="display:none" data-action="back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="bebas">HOJA DE RUTA</h1>
  </div>
  <div class="right" style="display:flex; gap:8px;">
    <button class="icon-btn" id="importBtn" style="display:none" data-action="go" data-target="#/bolos/import">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" data-action="toggle-theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div>

<div id="app"></div>

<div id="bottomnav">
  <button data-action="go" data-target="#/comer">
    <svg viewBox="0 0 24 24"><path d="M3 3v18M3 3h4v8H3M14 3v18M18 3a3 3 0 013 3v4a3 3 0 01-3 3M18 3v18"/></svg>
    Comer
  </button>
  <button data-action="go" data-target="#/favoritos">
    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    Favoritos
  </button>
</div>

<script>
// =========================================================================
// STORAGE
// =========================================================================
const store = {
  theme: {
    get: () => localStorage.getItem('hdr-theme') || 'dark',
    set: (v) => localStorage.setItem('hdr-theme', v),
  },
  bolos: {
    get: () => JSON.parse(localStorage.getItem('hdr-bolos') || '[]'),
    set: (v) => localStorage.setItem('hdr-bolos', JSON.stringify(v)),
  },
  favoritos: {
    get: () => JSON.parse(localStorage.getItem('hdr-favoritos') || '{}'),
    set: (v) => localStorage.setItem('hdr-favoritos', JSON.stringify(v)),
  },
};

// =========================================================================
// HELPERS
// =========================================================================
function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function mapsUrl(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function phoneBtns(raw) {
  if (!raw) return '';
  const digits = raw.replace(/[^\d+]/g, '');
  const wa = digits.replace(/[^\d]/g, '');
  return `<div class="phone-btns">
    <a href="tel:${esc(digits)}">📞 ${esc(raw)}</a>
    <a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WA</a>
  </div>`;
}
function icon(path) { return `<svg viewBox="0 0 24 24">${path}</svg>`; }
const ICONS = {
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  hotel: '<path d="M3 21V8a1 1 0 011-1h4v14M3 21h18M9 21V11h6v10M15 7V4a1 1 0 011-1h4a1 1 0 011 1v17"/>',
  contacts: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2M17 3.5a4 4 0 010 7"/>',
  vehicle: '<path d="M3 13l2-6h14l2 6M5 13h14v5H5zM7 18v2M17 18v2"/>',
  party: '<path d="M12 2l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"/>',
  cloud: '<path d="M17.5 19a4.5 4.5 0 000-9 6 6 0 00-11.4-1.5A4 4 0 006 17h11.5z"/>',
};
function sectionHead(iconKey, title) {
  return `<div class="section-head">${icon(ICONS[iconKey])}<span>${esc(title)}</span><div class="line"></div></div>`;
}
function fmtTime(totalMinutes) {
  totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
  const h = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
  const m = Math.floor(totalMinutes % 60).toString().padStart(2, '0');
  return `${h}:${m}`;
}
function timeToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// =========================================================================
// ROUTER
// =========================================================================
const routes = [];
function route(pattern, handler) { routes.push({ pattern, handler }); }
function matchRoute(hash) {
  for (const r of routes) {
    const paramNames = [];
    const regexStr = r.pattern.replace(/:[^/]+/g, (m) => { paramNames.push(m.slice(1)); return '([^/]+)'; });
    const match = hash.match(new RegExp(`^${regexStr}$`));
    if (match) {
      const params = {};
      paramNames.forEach((name, i) => params[name] = decodeURIComponent(match[i + 1]));
      return { handler: r.handler, params };
    }
  }
  return null;
}

const backStack = [];
function go(hash, { replace = false } = {}) {
  if (!replace && location.hash && location.hash !== hash) backStack.push(location.hash);
  location.hash = hash;
}
function goBack() {
  const prev = backStack.pop();
  location.hash = prev || '#/home';
}

function render() {
  const hash = location.hash || '#/home';
  const app = document.getElementById('app');
  const found = matchRoute(hash.replace(/^#/, '#'));
  const inBolos = hash.startsWith('#/bolos');
  const inComer = hash.startsWith('#/comer') || hash.startsWith('#/favoritos');

  document.getElementById('backBtn').style.display = inBolos ? 'flex' : 'none';
  document.getElementById('importBtn').style.display = (hash === '#/bolos') ? 'flex' : 'none';
  document.getElementById('bottomnav').classList.toggle('visible', inComer);
  document.querySelectorAll('#bottomnav button').forEach((b) => {
    b.classList.toggle('active', b.dataset.target === hash);
  });

  if (!found) { app.innerHTML = viewHome(); bindHome(); return; }
  app.innerHTML = found.handler.render(found.params);
  if (found.handler.bind) found.handler.bind(found.params);
  window.scrollTo(0, 0);
}

// =========================================================================
// VIEW: HOME
// =========================================================================
function viewHome() {
  const n = store.bolos.get().length;
  return `
  <div id="homeView">
    <div class="home-half home-split" data-action="go" data-target="#/bolos">
      <div class="home-title-bolos bebas">BOLOS</div>
      <div class="home-sub">${n} concierto${n === 1 ? '' : 's'}</div>
    </div>
    <div class="home-half" data-action="go" data-target="#/comer">
      <div class="home-title-lomo bebas">LOMOQUESO</div>
      <div class="home-sub">Dónde comer en ruta</div>
    </div>
  </div>`;
}
function bindHome() {}
route('#/home', { render: viewHome, bind: bindHome });

// =========================================================================
// VIEW: BOLO LIST
// =========================================================================
function viewBoloList() {
  const bolos = store.bolos.get();
  if (!bolos.length) {
    return `<div class="empty-state">No hay bolos importados todavía.<br>Pulsa el icono de importar arriba para añadir uno desde Google Sheets.</div>`;
  }
  return bolos.map((b) => `
    <div class="bolo-row" data-action="go" data-target="#/bolos/${esc(b.id)}">
      <div class="venue bebas">${esc(b.venue || 'Sin nombre')}</div>
      <div class="right">
        <div class="citydate">${esc(b.date || '')}</div>
        <div class="duration bebas">${esc(b.duration || '')}</div>
      </div>
    </div>
  `).join('');
}
route('#/bolos', { render: viewBoloList });

// =========================================================================
// VIEW: IMPORT
// =========================================================================
function viewImport() {
  return `
  <div class="import-wrap">
    <div class="input-row" id="importInputRow">
      <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/...">
      <span class="tick">✓</span>
    </div>
    <button class="btn-red" id="importSubmitBtn" disabled>IMPORTAR</button>
    <div class="import-error" id="importError"></div>
    <div class="note">Sheet idéntico a la plantilla = perfecto. Similar = campos interpretados lo mejor posible. Muy diferente = campos vacíos.</div>
  </div>`;
}
function bindImport() {
  const input = document.getElementById('sheetUrlInput');
  const row = document.getElementById('importInputRow');
  const btn = document.getElementById('importSubmitBtn');
  const errBox = document.getElementById('importError');

  function validate() {
    const valid = /docs\.google\.com\/spreadsheets/.test(input.value);
    row.classList.toggle('valid', valid);
    btn.disabled = !valid;
    return valid;
  }
  input.addEventListener('input', validate);

  btn.addEventListener('click', async () => {
    if (!validate()) return;
    btn.disabled = true;
    btn.textContent = 'IMPORTANDO...';
    errBox.textContent = '';
    try {
      const r = await fetch(`/api/bolo?sheetId=${encodeURIComponent(input.value)}`);
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Error importando');
      const bolo = { id: Date.now().toString(), ...data };
      const bolos = store.bolos.get();
      bolos.push(bolo);
      store.bolos.set(bolos);
      go(`#/bolos/${bolo.id}`, { replace: true });
    } catch (err) {
      errBox.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'IMPORTAR';
    }
  });
}
route('#/bolos/import', { render: viewImport, bind: bindImport });

// =========================================================================
// VIEW: BOLO DETAIL
// =========================================================================
function viewBoloDetail({ id }) {
  const bolo = store.bolos.get().find((b) => b.id === id);
  if (!bolo) return `<div class="empty-state">Bolo no encontrado.</div>`;

  const hero = `
    <div class="hero">
      <div class="hero-top">
        <div class="hero-venue bebas">${esc(bolo.venue)}</div>
        <div class="hero-right">
          <div class="hero-duration bebas">${esc(bolo.duration)}</div>
          <div class="hero-date">${esc(bolo.date)}</div>
          ${bolo.weather ? `<div class="hero-weather">☁ ${esc(bolo.weather)}</div>` : ''}
        </div>
      </div>
      <div class="hero-btns">
        ${bolo.venueAddr ? `<a class="hero-btn-venue" href="${mapsUrl(bolo.venueAddr)}" target="_blank" rel="noopener">Venue Maps</a>` : ''}
        ${bolo.riderUrl ? `<a class="btn-neutral" href="${esc(bolo.riderUrl)}" target="_blank" rel="noopener">Rider</a>` : ''}
      </div>
      ${bolo.acceso ? `<div class="hero-acceso">🚐 <span>ACCESO: ${esc(bolo.acceso)}</span></div>` : ''}
    </div>`;

  const agenda = (bolo.agenda && bolo.agenda.length) ? `
    <div class="section">
      ${sectionHead('calendar', 'AGENDA')}
      <div class="timeline">
        ${bolo.agenda.map((it) => `
          <div class="tl-item type-${esc(it.type)}">
            <div class="tl-dot"></div>
            <div class="tl-hora mono">${esc(it.hora)}</div>
            <div class="tl-label">${esc(it.label)}${it.dur ? `<span class="tl-dur">${esc(it.dur)}</span>` : ''}</div>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  const hotelCard = (h) => `
    <div class="hotel-card">
      <div class="hotel-name bebas">${esc(h.nombre)}</div>
      <div class="hotel-addr">${esc(h.addr)}</div>
      ${h.maps ? `<a class="btn-blue" href="${esc(h.maps)}" target="_blank" rel="noopener">Ver en Maps</a>` : (h.addr ? `<a class="btn-blue" href="${mapsUrl(h.addr)}" target="_blank" rel="noopener">Ver en Maps</a>` : '')}
      <div class="grid2">
        ${h.checkin ? `<div><div class="kv-label">Check-in</div><div class="kv-value">${esc(h.checkin)}</div></div>` : ''}
        ${h.checkout ? `<div><div class="kv-label">Check-out</div><div class="kv-value">${esc(h.checkout)}</div></div>` : ''}
        ${h.rooms ? `<div><div class="kv-label">Habitaciones</div><div class="kv-value">${esc(h.rooms)}</div></div>` : ''}
        ${h.breakfast ? `<div><div class="kv-label">Desayuno</div><div class="kv-value">${esc(h.breakfast)}</div></div>` : ''}
        ${h.parking ? `<div><div class="kv-label">Parking</div><div class="kv-value">${esc(h.parking)}</div></div>` : ''}
      </div>
      ${phoneBtns(h.phone)}
    </div>`;

  const alojamiento = (bolo.hotels && bolo.hotels.length) ? `
    <div class="section">
      ${sectionHead('hotel', 'ALOJAMIENTO')}
      ${bolo.hotels.map(hotelCard).join('')}
    </div>` : '';

  const contactos = (bolo.contactos && bolo.contactos.length) ? `
    <div class="section">
      ${sectionHead('contacts', 'CONTACTOS')}
      <div class="contact-grid">
        ${bolo.contactos.map((c) => `
          <div class="contact-item">
            <div class="role">${esc(c.role)}</div>
            <div class="nombre">${esc(c.nombre)}</div>
            ${phoneBtns(c.telefono)}
          </div>
        `).join('')}
      </div>
    </div>` : '';

  const veh = bolo.vehiculo || {};
  const vehiculo = (veh.tipo || veh.empresa) ? `
    <div class="section">
      ${sectionHead('vehicle', 'VEHÍCULO')}
      <div class="kv-list">
        ${veh.tipo ? `<div class="kv-row"><span class="k">Tipo</span><span>${esc(veh.tipo)}</span></div>` : ''}
        ${veh.empresa ? `<div class="kv-row"><span class="k">Empresa</span><span>${esc(veh.empresa)}</span></div>` : ''}
      </div>
      ${phoneBtns(veh.telefono)}
      <div class="grid2">
        ${veh.pickup ? `<div><div class="kv-label">Recogida</div><div class="kv-value">${esc(veh.pickup)}</div></div>` : ''}
        ${veh.devolucion ? `<div><div class="kv-label">Devolución</div><div class="kv-value">${esc(veh.devolucion)}</div></div>` : ''}
      </div>
    </div>` : '';

  const tourParty = (bolo.tourParty && bolo.tourParty.length) ? `
    <div class="section">
      ${sectionHead('party', 'TOUR PARTY')}
      <div class="kv-list">
        ${bolo.tourParty.map((tp) => `<div class="kv-row"><span class="k">${esc(tp.key)}</span><span>${esc(tp.value)}</span></div>`).join('')}
      </div>
    </div>` : '';

  return hero + agenda + alojamiento + contactos + vehiculo + tourParty;
}

let comerState = { budget: '€€', results: [], origin: null, dest: null, map: null };

function viewComer() {
  return `
  <form class="comer-form" id="comerForm">
    <div class="field">
      <label>Origen</label>
      <div class="geoloc-row">
        <input type="text" id="origenInput" placeholder="Ciudad o dirección de origen" required>
        <button type="button" class="icon-btn" id="geolocateBtn" title="Usar mi ubicación">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>Destino</label>
      <input type="text" id="destinoInput" placeholder="Ciudad o dirección de destino" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Hora de salida</label>

      </div>
      <div class="field">
        <label>Hora de comida</label>
        <input type="time" id="horaComidaInput" value="14:00" required>
      </div>
    </div>
    <div class="field">

      <div class="budget-row">
        <button type="button" class="budget-btn" data-budget="€">€</button>
        <button type="button" class="budget-btn" data-budget="€€">€€</button>

      </div>
    </div>

  </form>
  <div id="comerResults"></div>
  <div id="map" style="display:none;"></div>
  `;
}

async function geocodeOne(q) {
  const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&limit=1`);
  const data = await r.json();
  if (!data || !data.length) throw new Error(`No se encontró: ${q}`);
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), label: data[0].display_name };
}

function interpolateAlongRoute(coords, fraction) {
  // coords: array of [lng, lat]. Returns {lat,lng} at given fraction of total length.
  if (!coords || coords.length < 2) return null;
  const segs = [];
  let total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const a = { lat: coords[i][1], lng: coords[i][0] };
    const b = { lat: coords[i+1][1], lng: coords[i+1][0] };
    const d = haversine(a, b);
    segs.push({ a, b, d });
    total += d;
  }
  const target = total * Math.min(Math.max(fraction, 0), 1);
  let acc = 0;
  for (const s of segs) {
    if (acc + s.d >= target || s === segs[segs.length - 1]) {
      const segFrac = s.d ? (target - acc) / s.d : 0;
      return {
        lat: s.a.lat + (s.b.lat - s.a.lat) * segFrac,
        lng: s.a.lng + (s.b.lng - s.a.lng) * segFrac,
      };
    }
    acc += s.d;
  }
  return { lat: coords[coords.length-1][1], lng: coords[coords.length-1][0] };
}

function renderRestaurantCard(r) {
  const favs = store.favoritos.get();
  const isFav = !!favs[r.id];
  return `
    <div class="restaurant-card">
      <div class="restaurant-info">
        <div class="name">${esc(r.name)}</div>
        <div class="meta">${esc(r.eta)} · ${r.detourKm.toFixed(1)} km desvío · ${esc(r.price)} · ★ ${esc(r.rating)}</div>
      </div>
      <div class="restaurant-actions">
        <a class="icon-btn" href="${mapsUrl(r.name + ' ' + (r.addr||''))}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </a>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-action="toggle-fav" data-id="${esc(r.id)}">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
        </button>
      </div>
    </div>`;
}

function bindComer() {
  const form = document.getElementById('comerForm');
  const resultsBox = document.getElementById('comerResults');
  const mapDiv = document.getElementById('map');

  document.querySelectorAll('.budget-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.budget === comerState.budget);
    btn.addEventListener('click', () => {
      comerState.budget = btn.dataset.budget;
      document.querySelectorAll('.budget-btn').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  document.getElementById('geolocateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      comerState.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Mi ubicación' };
      document.getElementById('origenInput').value = 'Mi ubicación actual';
    }, () => alert('No se pudo obtener la ubicación'));
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultsBox.innerHTML = `<div class="loading">Buscando restaurantes en ruta...</div>`;
    mapDiv.style.display = 'none';
    try {
      const origenText = document.getElementById('origenInput').value;
      const destinoText = document.getElementById('destinoInput').value;
      const horaSalida = document.getElementById('horaSalidaInput').value;
      const horaComida = document.getElementById('horaComidaInput').value;
      const cocina = document.getElementById('cocinaInput').value;

      const origin = comerState.origin && origenText === 'Mi ubicación actual' ? comerState.origin : await geocodeOne(origenText);
      const dest = await geocodeOne(destinoText);
      comerState.origin = origin;
      comerState.dest = dest;

      const routeRes = await fetch(`/api/route?start=${origin.lng},${origin.lat}&end=${dest.lng},${dest.lat}`);
      const routeData = await routeRes.json();
      if (!routeRes.ok) throw new Error(routeData.error || 'Error calculando ruta');

      const feature = routeData.features && routeData.features[0];
      const coords = feature ? feature.geometry.coordinates : [[origin.lng, origin.lat], [dest.lng, dest.lat]];
      const totalDurationMin = feature ? feature.properties.summary.duration / 60 : haversine(origin, dest) / 80 * 60;

      const salidaMin = timeToMinutes(horaSalida);
      const comidaMin = timeToMinutes(horaComida);
      const elapsedAtMeal = Math.max(0, comidaMin - salidaMin);
      const fraction = totalDurationMin > 0 ? elapsedAtMeal / totalDurationMin : 0.5;
      const mealPoint = interpolateAlongRoute(coords, fraction) || dest;

      const restRes = await fetch('/api/restaurants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: mealPoint.lat, lng: mealPoint.lng, radius: 1500, cuisine: cocina || undefined }),
      });
      const restData = await restRes.json();
      if (!restRes.ok) throw new Error(restData.error || 'Error buscando restaurantes');

      const arrivalMin = salidaMin + fraction * totalDurationMin;
      const results = (restData.elements || []).map((el, i) => {
        const lat = el.lat ?? el.center?.lat;
        const lng = el.lon ?? el.center?.lon;
        const tags = el.tags || {};
        return {
          id: `${el.type}${el.id}`,
          name: tags.name || 'Restaurante sin nombre',
          addr: [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' '),
          lat, lng,
          eta: fmtTime(arrivalMin),
          detourKm: haversine(mealPoint, { lat, lng }),
          price: tags.price_range || '—',
          rating: tags.rating || '—',
        };
      }).sort((a, b) => a.detourKm - b.detourKm);

      comerState.results = results;

      if (!results.length) {
        resultsBox.innerHTML = `<div class="empty-state">No se encontraron restaurantes cerca del punto de comida.</div>`;
        return;
      }
      resultsBox.innerHTML = results.map(renderRestaurantCard).join('');
      renderMap(coords, mealPoint, results);
    } catch (err) {
      resultsBox.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
    }
  });
}

function renderMap(coords, mealPoint, results) {
  const mapDiv = document.getElementById('map');
  mapDiv.style.display = 'block';
  if (comerState.map) { comerState.map.remove(); comerState.map = null; }
  const map = L.map(mapDiv).setView([mealPoint.lat, mealPoint.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  const latlngs = coords.map(([lng, lat]) => [lat, lng]);
  L.polyline(latlngs, { color: '#c41a1a', weight: 3 }).addTo(map);
  results.forEach((r) => {
    if (r.lat && r.lng) L.marker([r.lat, r.lng]).addTo(map).bindPopup(esc(r.name));
  });
  comerState.map = map;
}

// =========================================================================
// GLOBAL CLICK DELEGATION
// =========================================================================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'go') { go(el.dataset.target); }
  else if (action === 'back') { goBack(); }
  else if (action === 'toggle-theme') { toggleTheme(); }
  else if (action === 'toggle-fav') { toggleFavorite(el.dataset.id); }
});

function toggleFavorite(id) {
  const favs = store.favoritos.get();
  if (favs[id]) {
    delete favs[id];
  } else {
    const r = comerState.results.find((x) => x.id === id);
    if (r) favs[id] = r;
  }
  store.favoritos.set(favs);
  render();
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.theme.set(next);
}
